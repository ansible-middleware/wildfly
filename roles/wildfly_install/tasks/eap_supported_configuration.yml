---
- name: "Ensure required information are provided"
  ansible.builtin.assert:
    that:
      - eap_install_version is defined and eap_install_version | length > 0
      - eap_install_java_version is defined
    quiet: true

- name: "Determine supported configurations for EAP {{ eap_install_version }}"
  ansible.builtin.set_fact:
    wildfly_install_supported_configuration: "{{ eap_install_supported_configuration['eap' + eap_install_version[:3]] }}"

- name: "Ensure target RHEL version is supported: {{ wildfly_install_supported_configuration.rhel }}"
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'RedHat' and ansible_facts['distribution'] == 'RedHat'
      - ansible_facts['distribution_major_version'] in wildfly_install_supported_configuration.rhel
    quiet: true
    fail_msg: >-
      This version of RHEL {{ ansible_facts['distribution_major_version'] }}
      is not supported for EAP{{ eap_install_version[:3] }},
      supported versions are: {{ wildfly_install_supported_configuration.rhel }}
  when:
    - eap_install_skip_supported_os_check is defined and not eap_install_skip_supported_os_check
    - ansible_facts['distribution_major_version'] is defined and ansible_facts['os_family'] is defined and ansible_facts['os_family'] == 'RedHat'

- name: "Ensure target OpenJDK version is supported: {{ wildfly_install_supported_configuration.openjdk }}"
  ansible.builtin.assert:
    that:
      - (eap_install_java_version | string) in wildfly_install_supported_configuration.openjdk
    quiet: true
    fail_msg: >-
      This version of OpenJDK used ({{ eap_install_java_version }})
      is not supported for EAP{{ eap_install_version[:3] }},
      supported version are: {{ wildfly_install_supported_configuration.openjdk }}
  when:
    - eap_install_skip_supported_openjdk_check is defined and not eap_install_skip_supported_openjdk_check
