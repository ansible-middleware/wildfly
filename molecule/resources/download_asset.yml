---
- name: "Load metadata on target asset file"
  ansible.builtin.stat:
    path: "{{ assets_server }}/{{ asset }}"
  register: asset_state

- name: "Download assets."
  ansible.builtin.get_url:
    url: "{{ assets_server }}/{{ asset }}"
    dest: "{{ lookup('env', 'PWD') }}"
    mode: "0664"
    validate_certs: false
  delegate_to: localhost
  when:
    - asset_state.stat is defined and asset_state.stat.exists is defined
    - not asset_state.stat.exists


- name: "Download assets"
  when:
    - wildfly_assets is defined and wildfly_assets | length > 0
  block:
    - name: "Download assets"
      ansible.builtin.get_url:
        url: "{{ assets_server }}/{{ asset }}"
        dest: "{{ lookup('env', 'PWD') }}"
        mode: "0664"
        validate_certs: false
      delegate_to: localhost
      loop: "{{ wildfly_assets }}"
      loop_control:
        loop_var: wildfly_asset
