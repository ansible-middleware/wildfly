- name: "Load metadata on installation directory {{ wildfly_validation_home }}"
  become: "{{ wildfly_validation_requires_become | default(true) }}"
  ansible.builtin.stat:
    path: "{{ wildfly_validation_home }}"
  register: wildfly_validation_home_status

- name: "Ensure installation directory exists with correct ownership: {{ wildfly_validation_home }}"
  become: "{{ wildfly_validation_requires_become | default(true) }}"
  ansible.builtin.assert:
    that:
      - wildfly_validation_home_status.stat.exists
      - wildfly_validation_home_status.stat.isdir
      - wildfly_validation_home_status.stat.gr_name == wildfly_validation_group
      - wildfly_validation_home_status.stat.pw_name == wildfly_validation_user
    fail_msg: wildfly installation folder is in a wrong state

- name: "Ensure user of the installation: {{ wildfly_validation_user }}"
  become: "{{ wildfly_validation_requires_become | default(true) }}"
  ansible.builtin.shell:
    cmd: |
        set -o pipefail
        find ./ -printf '%u %p\n' | { grep -v ^{{ wildfly_validation_user | quote }} || true; }
    chdir: "{{ wildfly_validation_home }}"
  changed_when: False
  register: wildfly_validation_files_wrong_user

- name: "Print files or directories owned by wrong user"
  ansible.builtin.debug:
    msg: "{{ wildfly_validation_files_wrong_user }}"
  when:
    - wildfly_validation_debug is defined

- name: "Fail if there are files/directories owned by different user than"
  ansible.builtin.fail:
    msg: "There are files or directories owned by different user than {{ wildfly_validation_user }}"
  when:
    - (wildfly_validation_files_wrong_user is not defined) or (wildfly_validation_files_wrong_user.stdout|length > 0)

- name: "Ensure group of installation: {{ wildfly_validation_group }}"
  become: "{{ wildfly_validation_requires_become | default(true) }}"
  ansible.builtin.shell:
    cmd: |
        set -o pipefail
        find ./ -printf '%g %p\n' | { grep -v ^{{ wildfly_validation_group | quote }} || true; }
    chdir: "{{ wildfly_validation_home }}"
  changed_when: False
  register: wildfly_validation_files_wrong_group

- name: "Print files or directories added to wrong group"
  ansible.builtin.debug:
    msg: "{{ wildfly_validation_files_wrong_group }}"
  when:
    - wildfly_validation_debug is defined

- name: "Fail if there are files/directories that belong to different group"
  ansible.builtin.fail:
    msg: "There are files or directories that belong to different group than {{ wildfly_validation_group }}"
  when:
    - (wildfly_validation_files_wrong_group is not defined) or (wildfly_validation_files_wrong_group.stdout|length > 0)
