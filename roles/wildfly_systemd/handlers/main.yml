---
- name: 'Restart WildFly'
  ansible.builtin.include_tasks: service.yml
  vars:
    instance_state: restarted
  listen: "restart_wildfly"

- name: "Perform daemon-reload"
  become: "{{ wildfly_systemd_require_privilege_escalation | default(true) }}"
  ansible.builtin.systemd:
    daemon_reload: true

- name: Execute restorecon
  become: "{{ wildfly_systemd_require_privilege_escalation | default(true) }}"
  ansible.builtin.command: "restorecon -R -v {{ wildfly_systemd_install_workdir }}"
  register: wildfly_systemd_selinux_output
  changed_when: wildfly_systemd_selinux_output.stdout_lines | length > 0
  when: wildfly_systemd_selinux_enabled
  listen: exec_restorecon
