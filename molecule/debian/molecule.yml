---
driver:
  name: docker
platforms:
  - name: debian12
    image: debian:bookworm
    pre_build_image: false
    privileged: true
    command: tail -f /dev/null
provisioner:
  name: ansible
  config_options:
    defaults:
      interpreter_python: auto_silent
  env:
    ANSIBLE_FORCE_COLOR: "true"
    ANSIBLE_ROLES_PATH: "../../roles"
scenario:
  test_sequence:
    - destroy
    - create
    - prepare
    - converge
    - verify
    - destroy
