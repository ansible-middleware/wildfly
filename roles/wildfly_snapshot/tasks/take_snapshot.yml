---
- name: "Ensure required parameters for snapshot are provided"
  ansible.builtin.assert:
    that:
      - wildfly_snapshot_jboss_home is defined
      - wildfly_snapshot_jboss_cli_controller_host is defined
      - wildfly_snapshot_jboss_cli_controller_port is defined
    fail_msg: "Missing required parameters to take a configuration snapshot."
    quiet: true

- name: "Build snapshot CLI command"
  ansible.builtin.set_fact:
    wildfly_snapshot_cli_command: >-
      {{ ':take-snapshot(name="' + wildfly_snapshot_name + '")'
      if wildfly_snapshot_name | default('') | length > 0
      else ':take-snapshot' }}

- name: "Take configuration snapshot"
  ansible.builtin.include_role:
    name: wildfly_utils
    tasks_from: jboss_cli.yml
  vars:
    wildfly_utils_jboss_home: "{{ wildfly_snapshot_jboss_home }}"
    wildfly_utils_jboss_cli_query: "{{ wildfly_snapshot_cli_command }}"
    wildfly_utils_jboss_cli_controller_host: "{{ wildfly_snapshot_jboss_cli_controller_host }}"
    wildfly_utils_jboss_cli_controller_port: "{{ wildfly_snapshot_jboss_cli_controller_port }}"
    wildfly_utils_port_range_offset: "{{ wildfly_snapshot_port_range_offset }}"
    wildfly_utils_jboss_cli_timeout: "{{ wildfly_snapshot_jboss_cli_timeout }}"

- name: "Extract snapshot file path from CLI result"
  ansible.builtin.set_fact:
    wildfly_snapshot_file_path: "{{ (wildfly_utils_cli_result.stdout | from_json).result }}"

- name: "Report snapshot location"
  ansible.builtin.debug:
    msg: "Configuration snapshot saved to: {{ wildfly_snapshot_file_path }}"
