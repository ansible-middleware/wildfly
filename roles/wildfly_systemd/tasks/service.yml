---
- name: Check arguments
  ansible.builtin.assert:
    that:
      - instance_state is defined
    quiet: true

- name: "Set instance {{ wildfly_systemd_instance_name }} state to {{ instance_state }}"
  throttle: 1
  ansible.builtin.systemd:
    name: "{{ wildfly_systemd_service_name }}"
    state: "{{ instance_state }}"
    enabled: "{{ wildfly_systemd_config.enabled | default(omit) }}"
    daemon_reload: true
  become: "{{ wildfly_systemd_require_privilege_escalation | default(true) }}"
