---
- name: Validate credentials
  ansible.builtin.assert:
    that:
      - (rhn_username is defined and eap_install_enable is defined and eap_install_enable) or not eap_install_enable is defined or not eap_install_enable
      - (rhn_password is defined and eap_install_enable is defined and eap_install_enable) or not eap_install_enable is defined or not eap_install_enable
    quiet: true
    fail_msg: >-
      Cannot install Red Hat Enterprise Application Platform without RHN credentials.
      Define rhn_username and rhn_password are defined or set eap_install_offline_install
  when: not wildfly_install_offline_install and not (wildfly_install_use_prospero | default(false))

- name: "Validate version matches expected scheme (X.y.z): {{ wildfly_install_version }}"
  ansible.builtin.assert:
    that:
      - wildfly_install_version | regex_search('[0-9]{1}.[0-9]{1}.[0-9]{1}') | length > 0
    quiet: true
    fail_msg: "The provided version for the Java server does not follows the required scheme: {{ wildfly_install_version }}"

- name: "Warn if Java version is below minimum required for WildFly {{ wildfly_install_version }}"
  ansible.builtin.debug:
    msg: >-
      WARNING: WildFly {{ wildfly_install_version }} requires Java 17 or later to run.
      The configured Java version is {{ wildfly_install_java_version }}, which may cause startup failures.
      Please set wildfly_java_version to 17 or higher.
  when:
    - not eap_install_enable is defined or not eap_install_enable
    - wildfly_install_version.split('.')[0] | int >= 33
    - wildfly_install_java_version | string is not match('^1\\..*')
    - wildfly_install_java_version | int < 17

- name: "Validate archive exists on controller for offline install: {{ wildfly_install_archive_filename }}"
  ansible.builtin.assert:
    that:
      - wildfly_install_version is defined
      - >-
        wildfly_archive_filename_local |
        default(wildfly_install_download_controller_download_dir + '/' + wildfly_install_archive_filename)
        is exists
    quiet: true
    fail_msg: >-
      An offline install was requested, but files are not present on the controller:
      {{ wildfly_archive_filename_local |
      default(wildfly_install_download_controller_download_dir + '/' + wildfly_install_archive_filename) }}
  when:
    - wildfly_install_offline_install and wildfly_install_archive_filename_on_controller

- name: "Validate patch version for offline installs"
  ansible.builtin.assert:
    that:
      - eap_install_patch_version is defined and eap_install_patch_version | length > 0
    quiet: true
    fail_msg: "An offline install was requested, but eap_install_patch_version parameter was not defined"
  when:
    - wildfly_install_offline_install
    - eap_install_enable is defined and eap_install_enable
    - eap_install_apply_cp is defined and eap_install_apply_cp

- name: "Validate additional zipfiles for offline install: {{ wildfly_install_archive_filename }}"
  ansible.builtin.assert:
    that:
      - >-
        not eap_install_apply_cp or (eap_install_patch_version is defined and
        (wildfly_install_download_controller_download_dir
        + '/' + eap_install_patch_archive_filename) is exists)
      - >-
        not eap_install_elytron_adapter or
        ((wildfly_install_download_controller_download_dir
        + '/' + eap_install_elytron_adapter_archive_filename) is exists)
    quiet: true
    fail_msg: >-
      An offline install was requested, but files are not present on the controller:
      {{ (wildfly_install_download_controller_download_dir + '/' +
      eap_install_patch_archive_filename) if eap_install_apply_cp else '' }}
      {{ (wildfly_install_download_controller_download_dir + '/' +
      eap_install_elytron_adapter_archive_filename)
      if eap_install_elytron_adapter else '' }}
  when:
    - wildfly_install_offline_install
    - eap_install_enable is defined and eap_install_enable

- name: "Validate node identifier length"
  ansible.builtin.assert:
    that:
      - wildfly_install_node_id | length <= 23
    quiet: true
    fail_msg: "The node ID in variable wildfly_install_node_id cannot exceed 23 characters length"
  when:
    - wildfly_install_node_id is defined

- name: "Ensure environement matches EAP supported configuration."
  ansible.builtin.include_tasks: eap_supported_configuration.yml
  when:
    - eap_install_version is defined

- name: "Check that required packages list has been provided."
  ansible.builtin.assert:
    that:
      - wildfly_install_prereqs_packages is defined
    quiet: true
    fail_msg: "Required packages list was not defined"

- name: "Add JDK package to prerequisites list: {{ wildfly_install_config.java.package_name }}"
  ansible.builtin.set_fact:
    wildfly_install_prereqs_packages: "{{ wildfly_install_prereqs_packages + [wildfly_install_config.java.package_name] }}"
  when:
    - wildfly_install_config.java is defined
    - wildfly_install_config.java.package_name is defined
    - wildfly_install_config.java.package_name | length > 0

- name: "Add selinux package to prerequisites list"
  ansible.builtin.set_fact:
    wildfly_install_prereqs_packages: "{{ wildfly_install_prereqs_packages + ['policycoreutils'] }}"
  when:
    - wildfly_install_selinux_enabled

- name: "Install required packages ({{ wildfly_install_prereqs_packages | length }})"
  ansible.builtin.package:
    name: "{{ wildfly_install_prereqs_packages }}"
    state: present
  become: "{{ wildfly_install_requires_become | default(true) }}"
  when:
    - wildfly_install_prereqs_packages | length > 0
    - not wildfly_install_skip_prereqs is defined
    - ansible_facts['distribution_major_version'] != '8'

- name: "Install required packages on RHEL 8 (workaround for DNF module)"
  ansible.builtin.command:
    cmd: "dnf install -y {{ wildfly_install_prereqs_packages | join(' ') }}"
  become: "{{ wildfly_install_requires_become | default(true) }}"
  register: wildfly_install_dnf_install_result
  changed_when:
    - "'Installing:' in wildfly_install_dnf_install_result.stdout or 'Upgrading:' in wildfly_install_dnf_install_result.stdout"
  when:
    - wildfly_install_prereqs_packages | length > 0
    - not wildfly_install_skip_prereqs is defined
    - ansible_facts['distribution_major_version'] == '8'
