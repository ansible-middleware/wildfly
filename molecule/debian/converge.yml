---
- name: Test Debian-specific fixes
  hosts: all
  tasks:
    - name: Include wildfly_systemd role vars
      ansible.builtin.include_vars:
        file: ../../roles/wildfly_systemd/vars/main.yml

    - name: "Run JAVA_HOME detection command for {{ ansible_facts['os_family'] }}"
      ansible.builtin.shell: |
        set -o pipefail
        {{ wildfly_systemd_config.jvm_version_command[ansible_facts['os_family']] }}
      args:
        executable: /bin/bash
      changed_when: false
      register: java_home_result

    - name: Display detected JAVA_HOME
      ansible.builtin.debug:
        msg: "Detected JAVA_HOME: {{ java_home_result.stdout }}"

    - name: Install iproute2
      ansible.builtin.apt:
        name: iproute2
        state: present
      become: true
