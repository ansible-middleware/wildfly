argument_specs:
    main:
        options:
            wildfly_driver_module_dir:
                default: "{{ wildfly_driver_home }}/modules/{{ wildfly_driver_config.module_name | replace('.', '/') }}/main"
                description: "Path for module installation"
                type: "str"
            wildfly_driver_jdbc_version:
                required: true
                description: "Version of JDBC driver to download"
                type: "str"
            wildfly_driver_jar_filename:
                required: true
                description: "Filename of JDBC driver to download"
                type: "str"
            wildfly_driver_jar_url:
                required: true
                description: "URL for JDBC driver download"
                type: "str"
            wildfly_driver_jar_installation_path:
                default: "{{ wildfly_driver_module_dir }}/{{ wildfly_driver_jar_filename }}"
                description: "Path for JDBC driver installation"
                type: "str"
            wildfly_driver_module_name:
                required: true
                description: "Name for the JDBC driver module"
                type: "str"
            wildfly_driver_download_dir:
                default: "/tmp"
                description: "Temporary directory for the driver download"
                type: "str"
            wildfly_driver_offline_install:
                default: false
                description: "Enable offline install mode (download to control node, then copy to target)"
                type: "bool"
            wildfly_driver_version:
                default: "41.0.0.Final"
                description: "WildFly version to install"
                type: "str"
            wildfly_driver_home:
                default: "/opt/wildfly/wildfly-{{ wildfly_driver_version }}/"
                description: "WildFly installation directory"
                type: "str"
            wildfly_driver_user:
                default: "wildfly"
                description: "POSIX user account for WildFly"
                type: "str"
            wildfly_driver_group:
                default: "{{ wildfly_driver_user }}"
                description: "POSIX group for WildFly"
                type: "str"
            override_module_xml_template:
                description: "Override path of template used for module configuration"
                type: "str"
                required: false
    downstream:
        options:
            eap_driver_enable:
                default: true
                description: "Enable install of Red Hat JBoss EAP"
                type: "bool"
            eap_driver_version:
                default: "{{ eap_version | default('8.1.0') }}"
                description: "Red Hat EAP version to install"
                type: "str"
            eap_driver_install_workdir:
                default: "{{ eap_install_workdir | default('/opt/jboss_eap/') }}"
                description: "Root directory for installation"
                type: "str"
            eap_driver_home:
                default: "{{ eap_driver_install_workdir }}jboss-eap-{{ (eap_driver_version.split('.'))[0:2] | join('.') }}/"
                description: "Red Hat EAP installation path"
                type: "str"
